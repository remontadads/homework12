name: CI/CD — тесты и публикация в Docker Hub

on:
  push:
    branches: [ main, master, feature/** ]
    tags: [ 'v*' ]                        
  pull_request:
    branches: [ main, master ]            

jobs:
  test:
    name: Проверка кода и тесты
    runs-on: ubuntu-latest
    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Установка Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod  
          check-latest: true

      - name: Загрузка зависимостей
        run: go mod download

      - name: Статический анализ (go vet)
        run: go vet ./...

      - name: Запуск тестов
        run: go test -v -race ./...

  build-and-push:
    name: Сборка и публикация в Docker Hub
    needs: test                            
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Логин в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Извлечение метаданных (теги и labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/parcel-app
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Сборка и пуш образа
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}